<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>文件中心</title>
  <style>
    :root { --navy:#1F3A5F; --teal:#2a8c82; --bg:#f3f5f8; --line:#e1e6ec; --text:#1f2d3d; --muted:#667085; --danger:#b42318; --warn-bg:#fef4d9; --warn:#8a5a00; --ok-bg:#e3f4ea; --ok:#1d6b2f; }
    * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    html, body { margin:0; background:var(--bg); color:var(--text); font-family:-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif; font-size:16px; line-height:1.55; }
    .wrap { max-width:520px; margin:0 auto; padding:0 16px 32px; }
    .top { display:flex; align-items:center; gap:12px; padding:18px 0 14px; }
    .top img { width:42px; height:auto; }
    .top .firm { font-size:13px; color:var(--muted); }
    .top .title { font-size:20px; font-weight:700; color:var(--navy); line-height:1.2; }
    .card { background:#fff; border-radius:14px; padding:16px; margin-bottom:12px; box-shadow:0 1px 2px rgba(16,24,40,.06); border:1px solid var(--line); }
    .card h2 { font-size:17px; margin:0 0 6px; color:var(--navy); }
    .muted { color:var(--muted); font-size:14px; }
    .small { font-size:13px; }
    .badge { display:inline-block; font-size:12px; padding:2px 10px; border-radius:20px; background:#e8eef5; color:var(--navy); margin-left:6px; vertical-align:2px; white-space:nowrap; }
    .badge.warn { background:var(--warn-bg); color:var(--warn); } .badge.ok { background:var(--ok-bg); color:var(--ok); }
    .note { background:var(--warn-bg); color:var(--warn); border-radius:10px; padding:10px 12px; font-size:14px; margin-top:10px; }
    .info { background:#eef4fa; color:var(--navy); border-radius:10px; padding:10px 12px; font-size:14px; margin-top:10px; }
    .err { color:var(--danger); font-size:14px; margin-top:8px; min-height:1em; }
    .btn { display:block; width:100%; border:0; border-radius:12px; padding:14px; font-size:17px; font-weight:600; background:var(--navy); color:#fff; margin-top:12px; cursor:pointer; font-family:inherit; }
    .btn.teal { background:var(--teal); }
    .btn.ghost { background:#fff; color:var(--navy); border:1px solid #c5d0dc; font-weight:500; }
    .btn.link { background:none; color:var(--muted); font-size:15px; font-weight:400; padding:8px; margin-top:4px; }
    .btn:disabled { opacity:.55; }
    .btn.inline { display:inline-block; width:auto; padding:6px 14px; font-size:14px; margin:8px 0 0; }
    label.lbl { display:block; font-weight:600; margin:14px 0 6px; }
    input.in { width:100%; font-size:20px; padding:12px 14px; border:1.5px solid #c5d0dc; border-radius:12px; font-family:inherit; background:#fff; }
    input.in:focus { outline:none; border-color:var(--navy); }
    input.in.taxid { letter-spacing:4px; text-align:center; font-size:24px; }
    .big { font-size:22px; font-weight:700; color:var(--navy); text-align:center; padding:16px 10px; background:#f3f6fa; border-radius:12px; word-break:break-all; margin:8px 0; }
    .company { font-size:20px; font-weight:700; color:var(--navy); margin:6px 0 2px; }
    .steps { display:flex; gap:6px; margin:4px 0 14px; }
    .steps span { flex:1; height:4px; border-radius:2px; background:#d8dfe7; } .steps span.on { background:var(--teal); }
    .empty { text-align:center; padding:26px 16px; }
    .empty .icon { font-size:40px; }
    .suggest { background:#eef4fa; border-radius:12px; padding:12px; margin-top:12px; }
    .foot { text-align:center; color:var(--muted); font-size:13px; margin-top:22px; }
    .foot a { color:var(--navy); }
    .center { text-align:center; }
    .spin { width:38px; height:38px; margin:24vh auto 14px; border:4px solid #dde3ea; border-top-color:var(--navy); border-radius:50%; animation:spin 1s linear infinite; }
    @keyframes spin { to { transform:rotate(360deg); } }
    #busy { position:fixed; inset:0; background:rgba(243,245,248,.85); display:flex; flex-direction:column; align-items:center; justify-content:center; z-index:10; color:var(--navy); }
    #busy .spin { margin:0 0 12px; }
    .files { margin-top:10px; }
    .frow { display:flex; align-items:center; gap:12px; padding:12px 4px; border-bottom:1px solid var(--line); cursor:pointer; }
    .frow:last-child { border-bottom:0; }
    .frow.pick { cursor:default; } .frow.pick input { width:22px; height:22px; flex-shrink:0; }
    .ficon { font-size:26px; width:40px; text-align:center; flex-shrink:0; }
    .ficon img { width:40px; height:40px; object-fit:cover; border-radius:6px; background:#eef2f6; display:block; }
    .fmain { min-width:0; flex:1; } .fname { word-break:break-all; font-size:16px; }
    select.in { background:#fff; }
    .hidden { display:none !important; }
  </style>
  <link rel="preconnect" href="https://script.google.com">
  <link rel="preconnect" href="https://static.line-scdn.net">
</head>
<body>
  <div class="wrap">
    <div class="top">
      <img src="logo.png" alt="">
      <div><div class="firm" id="firm">永承會計師事務所</div><div class="title" id="title">文件中心</div></div>
    </div>
    <div id="app"><div class="spin"></div><div class="center muted" id="loadingText">載入中…</div></div>
  </div>
  <div id="busy" class="hidden"><div class="spin"></div><div id="busyText">處理中…</div></div>

  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script src="config.js?v=0.8.8"></script>
  <script src="app.js?v=0.9.1"></script>
</body>
</html>
